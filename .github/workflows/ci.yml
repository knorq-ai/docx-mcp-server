name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install test validators (xmllint + python-docx)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils
          python3 -m venv /tmp/docx-venv
          /tmp/docx-venv/bin/pip install --quiet python-docx
      - run: npm test
